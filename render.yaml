services:
  - type: web
    name: ministore-kh-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: USE_WEBHOOK
        value: "true"
      - key: ADMIN_PIN
        value: "1234"
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOW_DEV_MODE
        value: "false"
